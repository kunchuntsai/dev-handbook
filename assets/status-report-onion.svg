<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Helvetica, Arial, sans-serif" font-size="18" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Onion structure of a status report</title>
  <g transform="translate(220 210)">
    <circle r="190" fill="#fdf6d8" stroke="#c9ad5a" stroke-width="3"/>
    <circle r="140" fill="#f6e7bd" stroke="#c9ad5a" stroke-width="3"/>
    <circle r="90"  fill="#eed9a6" stroke="#c9ad5a" stroke-width="3"/>
    <circle r="45"  fill="#c99a78" stroke="#b07f5a" stroke-width="3"/>
  </g>
  <!-- leader lines -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="330" y1="60"  x2="470" y2="60"/>
    <line x1="340" y1="120" x2="470" y2="130"/>
    <line x1="245" y1="210" x2="470" y2="210"/>
    <line x1="330" y1="290" x2="470" y2="290"/>
  </g>
  <g fill="#333">
    <circle cx="330" cy="60"  r="4"/>
    <circle cx="340" cy="120" r="4"/>
    <circle cx="245" cy="210" r="4"/>
    <circle cx="330" cy="290" r="4"/>
  </g>
  <!-- labels -->
  <g>
    <rect x="480" y="35"  width="200" height="50" rx="6" fill="#fff" stroke="#e8d9a0" stroke-width="3"/>
    <text x="580" y="66"  text-anchor="middle" fill="#222">1. Context, impact</text>
    <rect x="480" y="105" width="200" height="50" rx="6" fill="#fff" stroke="#e8d9a0" stroke-width="3"/>
    <text x="580" y="136" text-anchor="middle" fill="#222">2. Scope, progress</text>
    <rect x="480" y="185" width="200" height="50" rx="6" fill="#fff" stroke="#c9ad5a" stroke-width="3"/>
    <text x="580" y="216" text-anchor="middle" fill="#222">3. Details</text>
    <rect x="480" y="265" width="200" height="50" rx="6" fill="#fff" stroke="#e8d9a0" stroke-width="3"/>
    <text x="580" y="296" text-anchor="middle" fill="#222">4. Actions, risks, time</text>
  </g>
  <text x="380" y="400" text-anchor="middle" fill="#666" font-size="14">Peel the onion from the outside in: reveal only the layers each audience needs.</text>
</svg>
